<!doctype html>
<html lang="en" data-theme="classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parosayshi</title>
    <meta name="description" content="Parth Jha's newspaper-style product design portfolio." />
    <link rel="canonical" href="https://parosayshi.com/" />
    <link rel="icon" href="/assets/8S5kxWGDe4xJ2m55bDTZC1NFu9k.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/assets/2gayEeCW3W50uTAMOkXXzfeV80.png" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("parosayshi:new-theme");
          if (["classic", "plum", "pine"].includes(theme)) {
            document.documentElement.dataset.theme = theme;
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="is-loading">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
