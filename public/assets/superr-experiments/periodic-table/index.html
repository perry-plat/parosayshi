<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Periodic Table of Elements</title>

    <!-- Fonts -->
    <style>
        @font-face {
            font-family: 'Gelica';
            src: url('fonts/gelica_regular.otf') format('opentype');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'Gelica';
            src: url('fonts/gelica_light.otf') format('opentype');
            font-weight: 300;
            font-display: swap;
        }
        @font-face {
            font-family: 'Gelica';
            src: url('fonts/gelica_medium.otf') format('opentype');
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: 'Geist Mono';
            src: url('fonts/geist_mono_regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }
    </style>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/grid.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/legend.css">
    <link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/browser.css">
</head>
<body>
    <!-- Main Container -->
    <div id="app" class="app-container">
        <!-- Grid View -->
        <div id="grid-view" class="view active">
            <!-- Close Button -->
            <button id="close-btn" class="close-btn" aria-label="Exit">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <!-- Header -->
            <header class="header">
                <h1>Periodic table of elements</h1>
            </header>

            <!-- Periodic Table Grid -->
            <div id="periodic-grid" class="periodic-grid"></div>

            <!-- Legend Bar -->
            <div id="legend-bar" class="legend-bar"></div>
        </div>

        <!-- Detail View -->
        <div id="detail-view" class="view">
            <!-- Back Button -->
            <button id="back-btn" class="back-btn" aria-label="Back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <!-- Two-Panel Layout -->
            <div class="detail-container">
                <!-- Left Panel: Element Identity -->
                <div class="detail-left">
                    <div id="element-tile" class="element-tile"></div>
                    <div id="element-info" class="element-info"></div>
                </div>

                <!-- Divider -->
                <div class="detail-divider"></div>

                <!-- Right Panel: Data Sections -->
                <div class="detail-right">
                    <div id="element-data" class="element-data"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/detail.js"></script>
    <script src="js/bohr.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
